name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"

      - name: Run tests with race detector
        run: go test -race -count=1 -v ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build binary
        run: go build -ldflags="-s -w" -o bin/guaita .
